name: Atualizar estado das lives

# Roda sozinho no GitHub, de graca. Nao depende do seu computador estar
# ligado. O resultado e um estado.json commitado no proprio repositorio,
# que o addon baixa pronto.

on:
  schedule:
    # A cada 5 minutos. O GitHub nao garante pontualidade em agendamentos
    # curtos - as vezes atrasa alguns minutos em horario de pico. Por isso
    # o addon aceita o arquivo como valido por 10 minutos e volta a apurar
    # por conta propria se ele estiver mais velho que isso.
    - cron: '*/5 * * * *'
  # permite rodar na mao pelo botao "Run workflow"
  workflow_dispatch:

# precisa poder gravar o estado.json de volta no repositorio
permissions:
  contents: write

concurrency:
  # se uma execucao ainda estiver rodando, a proxima espera em vez de
  # duas mexerem no mesmo arquivo
  group: estado-lives
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apurar quem esta ao vivo
        run: |
          python gerador/gerar_estado.py MATRIX/lives.json MATRIX/estado.json

      - name: Publicar se mudou
        run: |
          git config user.name "gerador-de-estado"
          git config user.email "actions@github.com"
          git add MATRIX/estado.json

          # sem mudanca real, nao cria commit: evita encher o historico
          if git diff --staged --quiet; then
            echo "Nada mudou desde a ultima apuracao."
            exit 0
          fi

          RESUMO=$(python - <<'EOF'
          import json
          d = json.load(open('MATRIX/estado.json', encoding='utf-8'))
          print("%d ao vivo, %d agendados, de %d canais"
                % (d.get('ao_vivo', 0), d.get('em_breve', 0),
                   d.get('total', 0)))
          EOF
          )

          git commit -m "estado: $RESUMO"
          git push
