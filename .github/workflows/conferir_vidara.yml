# ROBO QUE CONFERE OS CODIGOS DO vidara.json — ver scripts/conferir_vidara.py
# (08/11) Uma vez por dia abre a pagina de um lote de codigos de cada
# player (1 por vez, com pausa) e grava MATRIX/vidara_status.json com os
# que o site disse DUAS vezes seguidas que foram removidos. O app CINE GO!
# manda esse player para o fim da ordem. Nao precisa de segredo nenhum.
#
# (08/11, tarde) O lulu e o streamtape bloqueiam o servidor do GitHub: o
# tunel WARP e ligado SO para os dominios deles (scripts/ligar_warp.sh com
# WARP_HOSTS — o resto, inclusive o git push, vai pelo caminho normal).
# Se o tunel nao ligar (ou ligar sem conectar na Cloudflare — o script
# confere e tenta as outras portas do WARP), o robo roda do mesmo jeito
# (esses dois dao "nao sei" e nada muda para eles).
name: Conferir os códigos do vidara.json

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conferir-vidara
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # o pedido sai com a "assinatura" de um Chrome (o Cloudflare barra o Python puro)
      - name: Instalar o curl_cffi
        continue-on-error: true
        run: pip install --quiet curl_cffi

      - name: Ligar o túnel WARP (só lulu e streamtape)
        id: warp
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WARP_HOSTS="$(python scripts/conferir_vidara.py --dominios lulu streamtape)"
          echo "domínios: $WARP_HOSTS"
          export WARP_HOSTS
          bash scripts/ligar_warp.sh

      - name: Conferir os códigos
        env:
          CONFERIR_WARP: ${{ steps.warp.outcome }}
        run: python scripts/conferir_vidara.py

      - name: Desligar o túnel
        if: always() && steps.warp.outcome == 'success'
        run: |
          sudo wg-quick down warp || true
          [ -f /etc/hosts.antes_do_warp ] && sudo cp /etc/hosts.antes_do_warp /etc/hosts || true

      - name: Gravar o resultado
        run: |
          git config user.name "robo-conferir-vidara"
          git config user.email "robo-conferir-vidara@users.noreply.github.com"
          git add MATRIX/vidara_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "códigos do vidara.json conferidos (robô)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
