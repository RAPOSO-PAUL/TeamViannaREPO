name: Metadados do TMDB

on:
  # logo depois que o catalogo muda
  # (22/10) ...ou o tema da aba tematica (so o tema e refeito: menos de 1 min)
  push:
    paths:
      - "MATRIX/filmes.json"
      - "MATRIX/shows.json"
      - "MATRIX/series.json"
      - "MATRIX/tema.json"
  # todo dia as 04:00 de Brasilia (revisa 1/14 dos titulos)
  schedule:
    - cron: "0 7 * * *"
  # botao "Run workflow"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: metadados
  cancel-in-progress: false

jobs:
  metadados:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # (22/10) o envio anterior tambem: para saber se mudou so o tema
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # (22/10) envio que mexeu SO no MATRIX/tema.json: nao consulta o TMDB
      # (o tema.py refaz as listas com o que ja esta guardado)
      - name: O que mudou
        id: mudou
        run: |
          tmdb=sim
          if [ "${{ github.event_name }}" = "push" ]; then
            arquivos=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "?")
            echo "arquivos do envio: $arquivos"
            if [ "$arquivos" != "?" ] && ! echo "$arquivos" | grep -qE '^MATRIX/(filmes|shows|series)\.json$'; then
              tmdb=nao
            fi
          fi
          echo "tmdb=$tmdb" >> "$GITHUB_OUTPUT"
          echo "consultar o TMDB: $tmdb"

      - name: Consultar o TMDB
        if: steps.mudou.outputs.tmdb == 'sim'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          # so a rodada diaria (e o botao) revisa os antigos; o envio do
          # catalogo so busca os NOVOS — termina em poucos minutos
          REVISAR: ${{ github.event_name == 'push' && 'nao' || 'sim' }}
        run: python3 scripts/metadados_tmdb.py

      # (22/10) A ABA TEMATICA: as listas prontas para o app (sem TMDB)
      - name: Montar o tema
        run: python3 scripts/tema.py

      # (23/10) AS SINOPSES PARA O APP, em gavetas pequenas (sem TMDB)
      - name: Gavetas de sinopse
        run: python3 scripts/gavetas_sinopse.py

      - name: Publicar
        run: |
          git config user.name "metadados-bot"
          git config user.email "metadados-bot@users.noreply.github.com"
          git add MATRIX/metadados.json MATRIX/relatorio_tmdb.md
          # (22/10) os arquivos da aba tematica (os que existirem)
          # ("if" e nao "&&": com o bash do Actions parando no primeiro erro,
          # um arquivo que ainda nao existe nao pode derrubar a publicacao)
          for f in MATRIX/sinopses.json MATRIX/tema-pronto.json MATRIX/relatorio_tema.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # (23/10) as gavetas de sinopse que o app le
          if [ -d MATRIX/sinopse ]; then git add MATRIX/sinopse; fi
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "metadados $(date -u +%Y-%m-%dT%H:%MZ)"
          # se voce enviou algo enquanto o robo rodava, junta antes de enviar
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
