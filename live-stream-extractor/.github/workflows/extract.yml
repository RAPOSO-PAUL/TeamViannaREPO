name: Extract Live Streams

on:
  workflow_dispatch:
    inputs:
      url:
        description: "https://bolarolando.co/"
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run extractor
        env:
          SOURCE_URL: ${{ inputs.url }}
        run: |
          python extractor.py "$SOURCE_URL"

      - name: Display results
        run: |
          echo "=============================="
          echo "       STREAMS ENCONTRADOS"
          echo "=============================="
          cat streams.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: extracted-streams
          path: streams.json
